<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTS Local Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>TTS Local Studio</h1>
      <p class="hint">Paste your script, click generate, then wait for completion status.</p>

      <div class="tabRow">
        <button id="tabNormal" class="tabBtn active" type="button">Normal</button>
        <button id="tabTraining" class="tabBtn" type="button">Training</button>
      </div>

      <section id="panelNormal">
      <label for="text">Text</label>
      <textarea id="text" placeholder="Paste script here..."></textarea>

      <div class="grid">
        <label>Voice
          <select id="voice"></select>
        </label>
        <label>Style
          <select id="style"></select>
        </label>
        <label>Speech Style
          <select id="speechStyle">
            <option value="auto">auto</option>
            <option value="narrative">narrative</option>
            <option value="relaxed">relaxed</option>
            <option value="assertive">assertive</option>
            <option value="dramatic">dramatic</option>
            <option value="emotional">emotional</option>
          </select>
        </label>
        <label>Voice Tone
          <select id="voiceTone">
            <option value="auto">auto</option>
            <option value="deep">deep</option>
            <option value="bright">bright</option>
            <option value="clear">clear</option>
            <option value="soft">soft</option>
            <option value="off">off</option>
          </select>
        </label>
        <label class="toggleRow">Voice Character
          <input id="voiceCharacter" type="checkbox" checked />
        </label>
        <label>Rate
          <span class="miniNote">(speaking speed: `+` faster, `-` slower)</span>
          <input id="rate" type="range" min="-50" max="50" step="1" />
          <span id="rateValue" class="valueTag">0%</span>
        </label>
        <label>Pitch
          <span class="miniNote">(voice tone: `+` higher, `-` lower)</span>
          <input id="pitch" type="range" min="-50" max="50" step="1" />
          <span id="pitchValue" class="valueTag">0Hz</span>
        </label>
        <label>Volume
          <span class="miniNote">(loudness: `+` louder, `-` softer)</span>
          <input id="volume" type="range" min="-50" max="50" step="1" />
          <span id="volumeValue" class="valueTag">0%</span>
        </label>
        <label>Output Name
          <input id="outputName" type="text" placeholder="episode_01" />
        </label>
        <label class="toggleRow">Humanize
          <input id="humanize" type="checkbox" />
        </label>
        <label>Humanize Intensity
          <input id="humanizeIntensity" type="range" min="0" max="1" step="0.05" />
          <span id="humanizeIntensityValue" class="valueTag">0.45</span>
        </label>
      </div>

      <div class="actions">
        <button id="generateBtn" type="button">Generate Audio</button>
      </div>
      </section>

      <section id="panelTraining" hidden>
        <p class="hint">Training mode uses internal benchmark text, without manual text input.</p>
        <div class="grid">
          <label>Profile
            <select id="trainingProfile"></select>
          </label>
          <label>Style
            <select id="trainingStyle"></select>
          </label>
          <label>Voice
            <select id="trainingVoice"></select>
          </label>
          <label>Speech Style
            <select id="trainingSpeechStyle">
              <option value="auto">auto</option>
              <option value="narrative">narrative</option>
              <option value="relaxed">relaxed</option>
              <option value="assertive">assertive</option>
              <option value="dramatic">dramatic</option>
              <option value="emotional">emotional</option>
            </select>
          </label>
          <label>Voice Tone
            <select id="trainingVoiceTone">
              <option value="auto">auto</option>
              <option value="deep">deep</option>
              <option value="bright">bright</option>
              <option value="clear">clear</option>
              <option value="soft">soft</option>
              <option value="off">off</option>
            </select>
          </label>
          <label class="toggleRow">Voice Character
            <input id="trainingVoiceCharacter" type="checkbox" checked />
          </label>
          <label>Humanize Intensity
            <input id="trainingIntensity" type="range" min="0" max="1" step="0.05" />
            <span id="trainingIntensityValue" class="valueTag">0.45</span>
          </label>
          <label>Output Name
            <input id="trainingOutputName" type="text" placeholder="benchmark_style_profile" />
          </label>
        </div>
        <div class="actions">
          <button id="runTrainingBtn" type="button">Run Training Benchmark</button>
        </div>
        <div id="feedbackBox" class="feedbackBox">
          <label>Feedback Score
            <select id="feedbackScore">
              <option value="5">5 - Excellent</option>
              <option value="4">4 - Good</option>
              <option value="3">3 - Fair</option>
              <option value="2">2 - Poor</option>
              <option value="1">1 - Bad</option>
            </select>
          </label>
          <label>Feedback Notes
            <input id="feedbackNotes" type="text" placeholder="example: less dramatic at the ending" />
          </label>
          <label>Adjust Rate
            <span class="miniNote">(segment pace feedback)</span>
            <input id="adjustRate" type="range" min="-10" max="10" step="1" value="0" />
            <span id="adjustRateValue" class="valueTag">0</span>
          </label>
          <label>Adjust Pitch
            <span class="miniNote">(pitch height feedback)</span>
            <input id="adjustPitch" type="range" min="-10" max="10" step="1" value="0" />
            <span id="adjustPitchValue" class="valueTag">0</span>
          </label>
          <label>Adjust Volume
            <span class="miniNote">(loudness feedback)</span>
            <input id="adjustVolume" type="range" min="-10" max="10" step="1" value="0" />
            <span id="adjustVolumeValue" class="valueTag">0</span>
          </label>
          <label>Intent Target
            <select id="intentTarget">
              <option value="">(auto)</option>
              <option value="netral">netral</option>
              <option value="ceria">ceria</option>
              <option value="tegang">tegang</option>
              <option value="sedih">sedih</option>
              <option value="kaget">kaget</option>
              <option value="tegas">tegas</option>
              <option value="marah">marah</option>
              <option value="tenang">tenang</option>
            </select>
          </label>
          <label>Intensity Target
            <input id="intensityTarget" type="range" min="0" max="1" step="0.05" value="0.7" />
            <span id="intensityTargetValue" class="valueTag">0.70</span>
          </label>
          <label>Transition Note
            <input id="transitionNote" type="text" placeholder="example: tense to calm feels abrupt" />
          </label>
          <label>Voice Fit (1-5)
            <input id="voiceFit" type="range" min="1" max="5" step="1" value="4" />
            <span id="voiceFitValue" class="valueTag">4</span>
          </label>
          <button id="feedbackBtn" type="button" disabled>Submit Feedback</button>
        </div>
      </section>

      <section class="statusBox">
        <div id="status">Status: idle</div>
        <div id="job"></div>
        <div id="profileInfo" class="hintSmall"></div>
        <audio id="audioPreview" controls hidden></audio>
        <a id="download" href="#" hidden>Download MP3</a>
        <a id="downloadProsody" href="#" hidden>Download Prosody JSON</a>
        <pre id="logs" class="logs"></pre>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
